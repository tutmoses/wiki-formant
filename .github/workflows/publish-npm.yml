# Publish wiki-formant to npm whenever npm lacks the version in package.json.
#
# The gate is npm itself, never git history. GitHub runs this once per push, on
# the tip commit, so a push carrying several commits at one version has a
# single run, and that run must publish. The npm-publish concurrency group
# queues runs instead of cancelling them, so a run that starts after another
# published sees the version on npm and stops.
#
# Every push to main runs the job. A version already on npm is a clean no-op,
# except that scripts/unshipped.sh fails the run when src/ differs from what
# npm serves under that version: a src change without a bump ships nowhere.
#
# Auth note: this publishes with TRUSTED PUBLISHING (OIDC) — no token. The
# registry trusts a short-lived token minted by GitHub for this repository and
# this workflow file, which is why `id-token: write` is the whole credential.
# The matching half lives on npmjs.com under the package's Settings → Trusted
# Publisher: owner `tutmoses`, repo `wiki-formant`, workflow `publish-npm.yml`,
# no environment. Rename this file and publishing breaks until that field is
# updated — the failure is loud, but it is not obvious.
#
# A trusted-publisher config created after 3 Sep 2026 allows `npm stage publish`
# only unless direct publishing is also ticked. This job publishes directly, so
# that box has to be on; the staged path would need a human approval with 2FA
# per release, and this account has 2FA disabled.
#
# The trigger is deliberately push-to-main only. Never add a pull_request
# trigger: that is the path by which a fork could run workflow code with
# publishing rights in scope.

name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This is the publishing credential. It mints the OIDC token the registry
      # exchanges for publish rights, and it signs the provenance attestation
      # tying the tarball to this commit and workflow — so consumers can verify
      # the package was built here rather than uploaded from someone's laptop.
      id-token: write

    steps:
      # Full history: unshipped.sh diffs HEAD against the commit npm built from.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check whether npm has this version
        id: check
        run: |
          LOCAL="$(jq -r .version package.json)"
          NAME="$(jq -r .name package.json)"
          SERVED="$(npm view "$NAME@$LOCAL" version --prefer-online 2>/dev/null || true)"
          echo "local=$LOCAL served=${SERVED:-none}"
          if [ "$SERVED" = "$LOCAL" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $LOCAL is already on npm — nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The silent-no-op guard: a src/ change that npm does not have under the
      # current version ships nowhere. The pre-push hook runs the same script,
      # so this should only ever fire for a push made without the hook.
      - name: Refuse a src change that ships nowhere
        if: steps.check.outputs.changed == 'false'
        run: scripts/unshipped.sh

      # Build explicitly rather than leaning on prepublishOnly, so a
      # failure lands before the credential is ever in scope and reports as its
      # own step instead of as a publish error.
      # Trusted publishing needs npm >= 11.5.1; the npm bundled with a Node
      # image is whatever shipped with that Node, and an older one fails at the
      # last step with a plain 401 that says nothing about OIDC. Pin the floor
      # rather than trust the image.
      - name: Use an npm that speaks OIDC
        if: steps.check.outputs.changed == 'true'
        run: npm install -g npm@^11.5.1

      - name: Install
        if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: npm run build

      # No NODE_AUTH_TOKEN. npm mints its own credential from the OIDC token
      # granted above; --provenance stays explicit so that a run which somehow
      # loses that grant fails here rather than quietly shipping an unattested
      # tarball.
      #
      # verbose is not debug residue. Every failure path in npm's OIDC exchange
      # returns quietly and logs only at this level, so at the default one a
      # rejected exchange is indistinguishable from no exchange — npm falls
      # back to whatever token .npmrc holds (under setup-node, the placeholder
      # XXXXX-XXXXX) and the registry answers with a 404 naming the package,
      # which reads as if the package were missing. Verbose turns that into
      # "oidc Failed token exchange request" with the registry's own reason.
      #
      # npm can take a minute to serve a version it has just accepted, so a run
      # queued behind a release may read it as missing and publish again. The
      # registry refuses that with E403; it means the version is out, so it ends
      # the run cleanly. Every other failure stays a failure.
      - name: Publish
        if: steps.check.outputs.changed == 'true'
        run: |
          if npm publish --provenance --access public --loglevel verbose 2>&1 | tee publish.log; then exit 0; fi
          grep -q 'cannot publish over the previously published versions' publish.log || exit 1
          echo "::notice::$(jq -r .version package.json) was published by an earlier run."
