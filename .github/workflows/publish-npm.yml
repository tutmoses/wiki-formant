# Publish wiki-formant to npm when its version changes.
#
# Gated on the version actually moving, not on package.json being touched: a
# README link or a devDependency bump edits the same file, and an ungated job
# would fail the publish with EPUBLISHCONFLICT every time.
#
# The job runs on EVERY push to main rather than only on package.json changes,
# because the interesting failure is the one that used to be silent: editing
# src/ and pushing without a version bump did nothing at all — no run, no error,
# and npm quietly fell behind the repo. That is now a failed run that names the
# fix. A push touching only docs, tests or this workflow still ends as a clean
# no-op.
#
# Auth note: this publishes with TRUSTED PUBLISHING (OIDC) — no token. The
# registry trusts a short-lived token minted by GitHub for this repository and
# this workflow file, which is why `id-token: write` is the whole credential.
# The matching half lives on npmjs.com under the package's Settings → Trusted
# Publisher: owner `tutmoses`, repo `wiki-formant`, workflow `publish-npm.yml`,
# no environment. Rename this file and publishing breaks until that field is
# updated — the failure is loud, but it is not obvious.
#
# A trusted-publisher config created after 3 Sep 2026 allows `npm stage publish`
# only unless direct publishing is also ticked. This job publishes directly, so
# that box has to be on; the staged path would need a human approval with 2FA
# per release, and this account has 2FA disabled.
#
# The trigger is deliberately push-to-main only. Never add a pull_request
# trigger: that is the path by which a fork could run workflow code with
# publishing rights in scope.

name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This is the publishing credential. It mints the OIDC token the registry
      # exchanges for publish rights, and it signs the provenance attestation
      # tying the tarball to this commit and workflow — so consumers can verify
      # the package was built here rather than uploaded from someone's laptop.
      id-token: write

    steps:
      # Full history: the bump check diffs this push against its base commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check whether the version actually changed
        id: check
        run: |
          LOCAL="$(jq -r .version package.json)"
          NAME="$(jq -r .name package.json)"
          PUBLISHED="$(npm view "$NAME" version 2>/dev/null || echo none)"
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $LOCAL is already on npm — nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The silent-no-op guard. Shipping a src/ change without a version bump is
      # almost always a mistake, and the old path filter made it invisible.
      # Scoped to src/ deliberately: docs, tests and CI edits legitimately ship
      # nothing, and failing those would train everyone to ignore this job.
      - name: Refuse a src change that ships nowhere
        if: github.event_name == 'push' && steps.check.outputs.changed == 'false'
        run: |
          BEFORE="${{ github.event.before }}"
          # A new branch or a force-push leaves no usable base. Skip rather than
          # guess: a false failure here blocks an innocent push.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::No usable base commit — skipping the bump check."
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^src/'; then
            echo "::error::src/ changed but package.json still says $(jq -r .version package.json), which is already on npm. Bump the version in the same commit, or these changes ship nowhere."
            exit 1
          fi
          echo "::notice::No src/ changes in this push — nothing to publish is correct."

      # Build and test explicitly rather than leaning on prepublishOnly, so a
      # failure lands before the credential is ever in scope and reports as its
      # own step instead of as a publish error.
      # Trusted publishing needs npm >= 11.5.1; the npm bundled with a Node
      # image is whatever shipped with that Node, and an older one fails at the
      # last step with a plain 401 that says nothing about OIDC. Pin the floor
      # rather than trust the image.
      - name: Use an npm that speaks OIDC
        if: steps.check.outputs.changed == 'true'
        run: npm install -g npm@^11.5.1

      - name: Install
        if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: npm run build

      - name: Test
        if: steps.check.outputs.changed == 'true'
        run: node --test 'test/*.test.js'

      # No NODE_AUTH_TOKEN. npm mints its own credential from the OIDC token
      # granted above; --provenance stays explicit so that a run which somehow
      # loses that grant fails here rather than quietly shipping an unattested
      # tarball.
      - name: Publish
        if: steps.check.outputs.changed == 'true'
        run: npm publish --provenance --access public
